# Production overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - AUTH_ENABLED=true
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW_SECONDS=60
      - UPSTREAM_MODE=disabled
      - JURISDICTION_ENFORCE=true
      - SEED_REFERENCE_DATA=false
      # Override with real secret in production
      # - AUTH_SECRET_KEY=your-production-secret
      # - POLICY_SIGNING_KEY=secret-manager-value
      # - POLICY_SIGNING_KEY_ID=policy-key-2026-01
      # A PostgreSQL deployment must register conforming CoreStore and
      # PolicyRepository adapters before using these URLs:
      # - DATABASE_URL=postgresql+asyncpg://user:pass@db:5432/workflow
      # - POLICY_DATABASE_URL=postgresql+asyncpg://user:pass@db:5432/workflow
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
  worker:
    environment:
      - ENVIRONMENT=production
      - AUTH_ENABLED=true
      - RATE_LIMIT_ENABLED=true
      - UPSTREAM_MODE=disabled
      - JURISDICTION_ENFORCE=true
      - SEED_REFERENCE_DATA=false
